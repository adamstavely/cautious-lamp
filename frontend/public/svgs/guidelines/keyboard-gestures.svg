<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="keyboardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Keyboard representation -->
  <rect x="50" y="50" width="100" height="60" rx="4" fill="url(#keyboardGradient)" opacity="0.3" stroke="url(#keyboardGradient)" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Keyboard keys -->
  <rect x="60" y="60" width="15" height="15" rx="2" fill="url(#keyboardGradient)" opacity="0.5"/>
  <rect x="80" y="60" width="15" height="15" rx="2" fill="url(#keyboardGradient)" opacity="0.5"/>
  <rect x="100" y="60" width="15" height="15" rx="2" fill="url(#keyboardGradient)" opacity="0.5"/>
  <rect x="120" y="60" width="15" height="15" rx="2" fill="url(#keyboardGradient)" opacity="0.5"/>
  <rect x="70" y="85" width="20" height="15" rx="2" fill="url(#keyboardGradient)" opacity="0.5"/>
  <rect x="95" y="85" width="20" height="15" rx="2" fill="url(#keyboardGradient)" opacity="0.5"/>
  <!-- Gesture path - swipe/touch -->
  <path d="M 60 130 Q 80 120, 100 130 T 140 130" stroke="url(#keyboardGradient)" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- Gesture touch points -->
  <circle cx="60" cy="130" r="5" fill="url(#keyboardGradient)" opacity="0.7"/>
  <circle cx="100" cy="130" r="5" fill="url(#keyboardGradient)" opacity="0.7"/>
  <circle cx="140" cy="130" r="5" fill="url(#keyboardGradient)" opacity="0.7"/>
  <!-- Connection between keyboard and gesture -->
  <line x1="100" y1="110" x2="100" y2="125" stroke="url(#keyboardGradient)" stroke-width="2" opacity="0.3"/>
</svg>

