<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="gridGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Grid structure -->
  <!-- Vertical grid lines -->
  <line x1="60" y1="50" x2="60" y2="150" stroke="url(#gridGradient)" stroke-width="2" opacity="0.4"/>
  <line x1="100" y1="50" x2="100" y2="150" stroke="url(#gridGradient)" stroke-width="2" opacity="0.4"/>
  <line x1="140" y1="50" x2="140" y2="150" stroke="url(#gridGradient)" stroke-width="2" opacity="0.4"/>
  <!-- Horizontal grid lines -->
  <line x1="50" y1="80" x2="150" y2="80" stroke="url(#gridGradient)" stroke-width="2" opacity="0.4"/>
  <line x1="50" y1="120" x2="150" y2="120" stroke="url(#gridGradient)" stroke-width="2" opacity="0.4"/>
  <!-- Grid cells with content -->
  <rect x="50" y="50" width="50" height="30" rx="2" fill="url(#gridGradient)" opacity="0.3"/>
  <rect x="100" y="50" width="50" height="30" rx="2" fill="url(#gridGradient)" opacity="0.4"/>
  <rect x="50" y="80" width="50" height="40" rx="2" fill="url(#gridGradient)" opacity="0.5"/>
  <rect x="100" y="80" width="50" height="40" rx="2" fill="url(#gridGradient)" opacity="0.3"/>
  <rect x="50" y="120" width="100" height="30" rx="2" fill="url(#gridGradient)" opacity="0.4"/>
  <!-- Grid alignment indicators -->
  <circle cx="50" cy="50" r="3" fill="url(#gridGradient)" opacity="0.6"/>
  <circle cx="150" cy="50" r="3" fill="url(#gridGradient)" opacity="0.6"/>
  <circle cx="50" cy="150" r="3" fill="url(#gridGradient)" opacity="0.6"/>
  <circle cx="150" cy="150" r="3" fill="url(#gridGradient)" opacity="0.6"/>
</svg>

