<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="colorContrastGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Contrast comparison - light and dark areas -->
  <rect x="50" y="50" width="50" height="100" rx="4" fill="url(#colorContrastGradient)" opacity="0.8"/>
  <rect x="100" y="50" width="50" height="100" rx="4" fill="url(#colorContrastGradient)" opacity="0.3"/>
  <!-- Contrast indicator lines -->
  <line x1="50" y1="50" x2="100" y2="50" stroke="url(#colorContrastGradient)" stroke-width="2" opacity="0.5"/>
  <line x1="50" y1="150" x2="100" y2="150" stroke="url(#colorContrastGradient)" stroke-width="2" opacity="0.5"/>
  <!-- Color swatches showing contrast levels -->
  <circle cx="60" cy="70" r="8" fill="white" opacity="0.9"/>
  <circle cx="140" cy="70" r="8" fill="url(#colorContrastGradient)" opacity="0.6"/>
  <circle cx="60" cy="130" r="8" fill="url(#colorContrastGradient)" opacity="0.9"/>
  <circle cx="140" cy="130" r="8" fill="white" opacity="0.3"/>
  <!-- Contrast ratio indicator -->
  <line x1="75" y1="100" x2="125" y2="100" stroke="url(#colorContrastGradient)" stroke-width="2" opacity="0.4" stroke-dasharray="2,2"/>
</svg>

