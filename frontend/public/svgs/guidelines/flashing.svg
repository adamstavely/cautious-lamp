<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="flashingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Flashing pattern representation - pulsing circles -->
  <circle cx="100" cy="100" r="40" fill="url(#flashingGradient)" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="30" fill="url(#flashingGradient)" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="20" fill="url(#flashingGradient)" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="1s" repeatCount="indefinite"/>
  </circle>
  <!-- Warning indicators -->
  <path d="M 100 50 L 110 70 L 130 70 L 115 85 L 120 105 L 100 95 L 80 105 L 85 85 L 70 70 L 90 70 Z" fill="url(#flashingGradient)" opacity="0.6"/>
  <!-- Frequency lines -->
  <line x1="50" y1="140" x2="150" y2="140" stroke="url(#flashingGradient)" stroke-width="2" opacity="0.4"/>
  <line x1="50" y1="150" x2="150" y2="150" stroke="url(#flashingGradient)" stroke-width="2" opacity="0.4"/>
  <line x1="50" y1="160" x2="150" y2="160" stroke="url(#flashingGradient)" stroke-width="2" opacity="0.4"/>
</svg>

