<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="penpotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Design canvas representation -->
  <rect x="50" y="50" width="100" height="100" rx="4" fill="url(#penpotGradient)" opacity="0.2" stroke="url(#penpotGradient)" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Design elements on canvas -->
  <rect x="60" y="60" width="30" height="30" rx="3" fill="url(#penpotGradient)" opacity="0.5"/>
  <circle cx="120" cy="80" r="15" fill="url(#penpotGradient)" opacity="0.5"/>
  <path d="M 70 110 L 90 130 L 110 110" stroke="url(#penpotGradient)" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- Pen tool indicator -->
  <path d="M 130 60 L 140 50 L 145 55 L 135 65 Z" fill="url(#penpotGradient)" opacity="0.7"/>
  <line x1="130" y1="60" x2="125" y2="70" stroke="url(#penpotGradient)" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  <!-- Beginner guide indicators -->
  <circle cx="55" cy="55" r="4" fill="url(#penpotGradient)" opacity="0.6"/>
  <circle cx="145" cy="55" r="4" fill="url(#penpotGradient)" opacity="0.6"/>
  <circle cx="55" cy="145" r="4" fill="url(#penpotGradient)" opacity="0.6"/>
  <circle cx="145" cy="145" r="4" fill="url(#penpotGradient)" opacity="0.6"/>
  <!-- Learning path -->
  <path d="M 50 50 Q 50 30, 70 30" stroke="url(#penpotGradient)" stroke-width="2" fill="none" opacity="0.3" stroke-dasharray="3,3"/>
</svg>

