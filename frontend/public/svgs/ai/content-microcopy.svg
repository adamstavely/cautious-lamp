<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="contentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Text document with annotations -->
  <rect x="45" y="50" width="110" height="100" rx="3" fill="url(#contentGradient)" opacity="0.15" stroke="url(#contentGradient)" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Paragraph lines -->
  <line x1="55" y1="65" x2="145" y2="65" stroke="url(#contentGradient)" stroke-width="3" opacity="0.5"/>
  <line x1="55" y1="78" x2="135" y2="78" stroke="url(#contentGradient)" stroke-width="2.5" opacity="0.4"/>
  <line x1="55" y1="91" x2="140" y2="91" stroke="url(#contentGradient)" stroke-width="2.5" opacity="0.4"/>
  
  <!-- Microcopy annotation arrow pointing to text -->
  <path d="M 155 70 L 145 70 L 145 65 L 150 60 L 155 65 Z" fill="url(#contentGradient)" opacity="0.6"/>
  <rect x="155" y="60" width="30" height="20" rx="2" fill="url(#contentGradient)" opacity="0.5"/>
  <line x1="160" y1="68" x2="178" y2="68" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <line x1="160" y1="72" x2="175" y2="72" stroke="white" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Inline microcopy badge -->
  <rect x="55" y="105" width="28" height="14" rx="4" fill="url(#contentGradient)" opacity="0.7"/>
  <circle cx="62" cy="112" r="2" fill="white" opacity="0.9"/>
  <line x1="66" y1="112" x2="78" y2="112" stroke="white" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Helper text below content -->
  <line x1="55" y1="125" x2="100" y2="125" stroke="url(#contentGradient)" stroke-width="2" opacity="0.3" stroke-dasharray="3,3"/>
  <circle cx="105" cy="125" r="3" fill="url(#contentGradient)" opacity="0.5"/>
  <line x1="110" y1="125" x2="145" y2="125" stroke="url(#contentGradient)" stroke-width="2" opacity="0.3" stroke-dasharray="3,3"/>
  
  <!-- Contextual hint indicator -->
  <circle cx="140" cy="105" r="5" fill="url(#contentGradient)" opacity="0.4"/>
  <path d="M 140 100 L 140 103 L 137 103 L 137 107 L 143 107 L 143 103 L 140 103 Z" fill="url(#contentGradient)" opacity="0.6"/>
</svg>
