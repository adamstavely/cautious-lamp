<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="teamingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Human representation (left) -->
  <circle cx="70" cy="100" r="25" fill="url(#teamingGradient)" opacity="0.4"/>
  <circle cx="70" cy="85" r="10" fill="url(#teamingGradient)" opacity="0.6"/>
  <path d="M 70 95 Q 50 95 50 120 L 50 140 L 90 140 L 90 120 Q 90 95 70 95" fill="url(#teamingGradient)" opacity="0.5"/>
  <!-- Machine representation (right) -->
  <rect x="130" y="75" width="40" height="50" rx="4" fill="url(#teamingGradient)" opacity="0.4"/>
  <rect x="140" y="85" width="20" height="15" rx="2" fill="url(#teamingGradient)" opacity="0.6"/>
  <rect x="140" y="110" width="20" height="10" rx="2" fill="url(#teamingGradient)" opacity="0.6"/>
  <!-- Collaboration connection -->
  <path d="M 95 100 Q 100 80, 105 100" stroke="url(#teamingGradient)" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 95 100 Q 100 120, 105 100" stroke="url(#teamingGradient)" stroke-width="3" fill="none" opacity="0.5"/>
  <!-- Shared workspace in center -->
  <circle cx="100" cy="100" r="8" fill="url(#teamingGradient)" opacity="0.6"/>
  <circle cx="100" cy="100" r="4" fill="white" opacity="0.8"/>
</svg>

