<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="identityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Persona representation - layered identity -->
  <!-- Outer identity layer -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="url(#identityGradient)" stroke-width="3" opacity="0.4"/>
  <!-- Middle personality layer -->
  <circle cx="100" cy="100" r="35" fill="url(#identityGradient)" opacity="0.3"/>
  <!-- Core persona -->
  <circle cx="100" cy="100" r="20" fill="url(#identityGradient)" opacity="0.6"/>
  <!-- Identity markers -->
  <circle cx="100" cy="80" r="6" fill="url(#identityGradient)" opacity="0.7"/>
  <circle cx="85" cy="110" r="5" fill="url(#identityGradient)" opacity="0.7"/>
  <circle cx="115" cy="110" r="5" fill="url(#identityGradient)" opacity="0.7"/>
  <!-- Character traits radiating -->
  <line x1="100" y1="50" x2="100" y2="80" stroke="url(#identityGradient)" stroke-width="2" opacity="0.3"/>
  <line x1="50" y1="100" x2="80" y2="100" stroke="url(#identityGradient)" stroke-width="2" opacity="0.3"/>
  <line x1="120" y1="100" x2="150" y2="100" stroke="url(#identityGradient)" stroke-width="2" opacity="0.3"/>
  <line x1="100" y1="120" x2="100" y2="150" stroke="url(#identityGradient)" stroke-width="2" opacity="0.3"/>
</svg>

