<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="agenticGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Autonomous agent representation - central core with action paths -->
  <circle cx="100" cy="100" r="35" fill="url(#agenticGradient)" opacity="0.3" stroke="url(#agenticGradient)" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="100" cy="100" r="20" fill="url(#agenticGradient)" opacity="0.6"/>
  <!-- Action paths radiating outward -->
  <line x1="100" y1="100" x2="50" y2="50" stroke="url(#agenticGradient)" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="150" y2="50" stroke="url(#agenticGradient)" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="50" y2="150" stroke="url(#agenticGradient)" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="150" y2="150" stroke="url(#agenticGradient)" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <!-- Action nodes at path ends -->
  <circle cx="50" cy="50" r="6" fill="url(#agenticGradient)" opacity="0.5"/>
  <circle cx="150" cy="50" r="6" fill="url(#agenticGradient)" opacity="0.5"/>
  <circle cx="50" cy="150" r="6" fill="url(#agenticGradient)" opacity="0.5"/>
  <circle cx="150" cy="150" r="6" fill="url(#agenticGradient)" opacity="0.5"/>
  <!-- Decision points -->
  <circle cx="100" cy="100" r="4" fill="white" opacity="0.8"/>
</svg>

