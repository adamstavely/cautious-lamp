<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="onboardingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Onboarding steps - progressive path -->
  <!-- Step 1 -->
  <circle cx="60" cy="60" r="12" fill="url(#onboardingGradient)" opacity="0.6"/>
  <circle cx="60" cy="60" r="5" fill="white" opacity="0.8"/>
  <!-- Step 2 -->
  <circle cx="100" cy="60" r="12" fill="url(#onboardingGradient)" opacity="0.5"/>
  <circle cx="100" cy="60" r="5" fill="white" opacity="0.7"/>
  <!-- Step 3 -->
  <circle cx="140" cy="60" r="12" fill="url(#onboardingGradient)" opacity="0.4"/>
  <!-- Step 4 -->
  <circle cx="140" cy="100" r="12" fill="url(#onboardingGradient)" opacity="0.5"/>
  <!-- Step 5 -->
  <circle cx="140" cy="140" r="12" fill="url(#onboardingGradient)" opacity="0.6"/>
  <circle cx="140" cy="140" r="5" fill="white" opacity="0.8"/>
  <!-- Onboarding path -->
  <path d="M 60 60 L 100 60 L 140 60 L 140 100 L 140 140" stroke="url(#onboardingGradient)" stroke-width="3" fill="none" opacity="0.5"/>
  <!-- Agent representation -->
  <circle cx="60" cy="60" r="8" fill="url(#onboardingGradient)" opacity="0.3"/>
  <circle cx="100" cy="60" r="8" fill="url(#onboardingGradient)" opacity="0.3"/>
  <!-- Guide indicators -->
  <path d="M 50 50 L 45 45 L 50 40 L 55 45 Z" fill="url(#onboardingGradient)" opacity="0.5"/>
  <path d="M 150 50 L 155 45 L 150 40 L 145 45 Z" fill="url(#onboardingGradient)" opacity="0.5"/>
</svg>

