<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="loadingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Empty state container -->
  <rect x="50" y="60" width="100" height="80" rx="4" fill="url(#loadingGradient)" opacity="0.2" stroke="url(#loadingGradient)" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4,4"/>
  <!-- Loading skeleton elements -->
  <rect x="60" y="70" width="80" height="12" rx="2" fill="url(#loadingGradient)" opacity="0.3"/>
  <rect x="60" y="90" width="60" height="12" rx="2" fill="url(#loadingGradient)" opacity="0.3"/>
  <rect x="60" y="110" width="70" height="12" rx="2" fill="url(#loadingGradient)" opacity="0.3"/>
  <!-- Loading spinner -->
  <circle cx="100" cy="145" r="15" fill="none" stroke="url(#loadingGradient)" stroke-width="3" opacity="0.5" stroke-dasharray="8,4">
    <animateTransform attributeName="transform" type="rotate" values="0 100 145;360 100 145" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Empty state indicator -->
  <circle cx="100" cy="100" r="8" fill="url(#loadingGradient)" opacity="0.2"/>
  <line x1="95" y1="95" x2="105" y2="105" stroke="url(#loadingGradient)" stroke-width="2" opacity="0.3"/>
  <line x1="105" y1="95" x2="95" y2="105" stroke="url(#loadingGradient)" stroke-width="2" opacity="0.3"/>
</svg>

