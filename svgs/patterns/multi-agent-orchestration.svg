<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="orchestrationGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Multiple agents in orchestration -->
  <!-- Agent 1 -->
  <circle cx="70" cy="70" r="18" fill="url(#orchestrationGradient)" opacity="0.5"/>
  <circle cx="70" cy="70" r="8" fill="white" opacity="0.7"/>
  <!-- Agent 2 -->
  <circle cx="130" cy="70" r="18" fill="url(#orchestrationGradient)" opacity="0.5"/>
  <circle cx="130" cy="70" r="8" fill="white" opacity="0.7"/>
  <!-- Agent 3 -->
  <circle cx="70" cy="130" r="18" fill="url(#orchestrationGradient)" opacity="0.5"/>
  <circle cx="70" cy="130" r="8" fill="white" opacity="0.7"/>
  <!-- Agent 4 -->
  <circle cx="130" cy="130" r="18" fill="url(#orchestrationGradient)" opacity="0.5"/>
  <circle cx="130" cy="130" r="8" fill="white" opacity="0.7"/>
  <!-- Central orchestrator -->
  <circle cx="100" cy="100" r="25" fill="url(#orchestrationGradient)" opacity="0.6" stroke="url(#orchestrationGradient)" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="100" cy="100" r="12" fill="url(#orchestrationGradient)" opacity="0.7"/>
  <!-- Orchestration connections -->
  <line x1="88" y1="88" x2="70" y2="70" stroke="url(#orchestrationGradient)" stroke-width="2" opacity="0.4"/>
  <line x1="112" y1="88" x2="130" y2="70" stroke="url(#orchestrationGradient)" stroke-width="2" opacity="0.4"/>
  <line x1="88" y1="112" x2="70" y2="130" stroke="url(#orchestrationGradient)" stroke-width="2" opacity="0.4"/>
  <line x1="112" y1="112" x2="130" y2="130" stroke="url(#orchestrationGradient)" stroke-width="2" opacity="0.4"/>
  <!-- Coordination flow -->
  <path d="M 70 70 Q 50 100, 70 130" stroke="url(#orchestrationGradient)" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="3,3"/>
  <path d="M 130 70 Q 150 100, 130 130" stroke="url(#orchestrationGradient)" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="3,3"/>
</svg>

