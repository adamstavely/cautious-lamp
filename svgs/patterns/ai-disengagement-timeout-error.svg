<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="disengagementGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Disconnected state -->
  <circle cx="100" cy="100" r="30" fill="url(#disengagementGradient)" opacity="0.3" stroke="url(#disengagementGradient)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6,3"/>
  <!-- Broken connection -->
  <line x1="70" y1="100" x2="85" y2="100" stroke="url(#disengagementGradient)" stroke-width="3" opacity="0.5"/>
  <line x1="115" y1="100" x2="130" y2="100" stroke="url(#disengagementGradient)" stroke-width="3" opacity="0.5"/>
  <!-- Timeout indicator - clock -->
  <circle cx="60" cy="60" r="15" fill="none" stroke="url(#disengagementGradient)" stroke-width="2" opacity="0.5"/>
  <line x1="60" y1="60" x2="60" y2="50" stroke="url(#disengagementGradient)" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="60" y1="60" x2="65" y2="60" stroke="url(#disengagementGradient)" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <!-- Error indicator -->
  <circle cx="140" cy="60" r="12" fill="url(#disengagementGradient)" opacity="0.5"/>
  <line x1="135" y1="55" x2="145" y2="65" stroke="white" stroke-width="2" opacity="0.8" stroke-linecap="round"/>
  <line x1="145" y1="55" x2="135" y2="65" stroke="white" stroke-width="2" opacity="0.8" stroke-linecap="round"/>
  <!-- Disengagement path -->
  <path d="M 100 70 Q 100 50, 80 50" stroke="url(#disengagementGradient)" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="4,2"/>
  <!-- Error state markers -->
  <rect x="85" y="85" width="6" height="6" rx="1" fill="url(#disengagementGradient)" opacity="0.4"/>
  <rect x="109" y="85" width="6" height="6" rx="1" fill="url(#disengagementGradient)" opacity="0.4"/>
  <rect x="85" y="109" width="6" height="6" rx="1" fill="url(#disengagementGradient)" opacity="0.4"/>
  <rect x="109" y="109" width="6" height="6" rx="1" fill="url(#disengagementGradient)" opacity="0.4"/>
</svg>

