<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="featuresGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- New feature sparkle/star -->
  <path d="M 100 50 L 105 65 L 120 65 L 108 75 L 113 90 L 100 80 L 87 90 L 92 75 L 80 65 L 95 65 Z" fill="url(#featuresGradient)" opacity="0.7"/>
  <!-- Feature elements radiating -->
  <circle cx="70" cy="80" r="10" fill="url(#featuresGradient)" opacity="0.5"/>
  <circle cx="130" cy="80" r="10" fill="url(#featuresGradient)" opacity="0.5"/>
  <circle cx="70" cy="120" r="10" fill="url(#featuresGradient)" opacity="0.5"/>
  <circle cx="130" cy="120" r="10" fill="url(#featuresGradient)" opacity="0.5"/>
  <!-- Central feature hub -->
  <circle cx="100" cy="100" r="20" fill="url(#featuresGradient)" opacity="0.4"/>
  <circle cx="100" cy="100" r="10" fill="url(#featuresGradient)" opacity="0.6"/>
  <!-- Connection lines -->
  <line x1="100" y1="70" x2="70" y2="80" stroke="url(#featuresGradient)" stroke-width="2" opacity="0.3"/>
  <line x1="100" y1="70" x2="130" y2="80" stroke="url(#featuresGradient)" stroke-width="2" opacity="0.3"/>
  <line x1="100" y1="130" x2="70" y2="120" stroke="url(#featuresGradient)" stroke-width="2" opacity="0.3"/>
  <line x1="100" y1="130" x2="130" y2="120" stroke="url(#featuresGradient)" stroke-width="2" opacity="0.3"/>
  <!-- New badge indicator -->
  <circle cx="130" cy="50" r="8" fill="url(#featuresGradient)" opacity="0.7"/>
  <circle cx="130" cy="50" r="4" fill="white" opacity="0.9"/>
</svg>

