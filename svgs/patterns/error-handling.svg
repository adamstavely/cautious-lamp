<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="errorHandlingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Error state - broken/warning indicator -->
  <circle cx="100" cy="100" r="30" fill="url(#errorHandlingGradient)" opacity="0.3" stroke="url(#errorHandlingGradient)" stroke-width="3" stroke-opacity="0.5"/>
  <!-- Error symbol -->
  <line x1="85" y1="85" x2="115" y2="115" stroke="white" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
  <line x1="115" y1="85" x2="85" y2="115" stroke="white" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
  <!-- Error handling paths - recovery options -->
  <path d="M 100 70 Q 70 70, 70 100" stroke="url(#errorHandlingGradient)" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="3,3"/>
  <path d="M 100 70 Q 130 70, 130 100" stroke="url(#errorHandlingGradient)" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="3,3"/>
  <!-- Recovery indicators -->
  <circle cx="70" cy="100" r="6" fill="url(#errorHandlingGradient)" opacity="0.5"/>
  <circle cx="130" cy="100" r="6" fill="url(#errorHandlingGradient)" opacity="0.5"/>
  <!-- Error message container -->
  <rect x="50" y="130" width="100" height="30" rx="3" fill="url(#errorHandlingGradient)" opacity="0.2" stroke="url(#errorHandlingGradient)" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="60" y1="140" x2="90" y2="140" stroke="url(#errorHandlingGradient)" stroke-width="2" opacity="0.4"/>
  <line x1="60" y1="150" x2="80" y2="150" stroke="url(#errorHandlingGradient)" stroke-width="2" opacity="0.4"/>
</svg>

