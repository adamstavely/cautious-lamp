<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="safeExplorationGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Safe boundary circle -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="url(#safeExplorationGradient)" stroke-width="3" opacity="0.3"/>
  <!-- Safe zone inner area -->
  <circle cx="100" cy="100" r="35" fill="url(#safeExplorationGradient)" opacity="0.2"/>
  <!-- Exploration paths within safe boundaries -->
  <path d="M 100 65 Q 120 80, 135 100 Q 120 120, 100 135 Q 80 120, 65 100 Q 80 80, 100 65" stroke="url(#safeExplorationGradient)" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- Safe exploration nodes -->
  <circle cx="100" cy="65" r="6" fill="url(#safeExplorationGradient)" opacity="0.6"/>
  <circle cx="135" cy="100" r="6" fill="url(#safeExplorationGradient)" opacity="0.6"/>
  <circle cx="100" cy="135" r="6" fill="url(#safeExplorationGradient)" opacity="0.6"/>
  <circle cx="65" cy="100" r="6" fill="url(#safeExplorationGradient)" opacity="0.6"/>
  <!-- Central safe point -->
  <circle cx="100" cy="100" r="8" fill="url(#safeExplorationGradient)" opacity="0.7"/>
  <circle cx="100" cy="100" r="4" fill="white" opacity="0.8"/>
  <!-- Safety indicators at boundary -->
  <rect x="95" y="45" width="10" height="4" rx="2" fill="url(#safeExplorationGradient)" opacity="0.5"/>
  <rect x="145" y="95" width="4" height="10" rx="2" fill="url(#safeExplorationGradient)" opacity="0.5"/>
  <rect x="95" y="151" width="10" height="4" rx="2" fill="url(#safeExplorationGradient)" opacity="0.5"/>
  <rect x="45" y="95" width="4" height="10" rx="2" fill="url(#safeExplorationGradient)" opacity="0.5"/>
</svg>

