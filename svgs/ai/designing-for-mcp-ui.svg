<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="mcpUIGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Protocol/connection representation - interconnected nodes -->
  <rect x="40" y="40" width="30" height="30" rx="4" fill="url(#mcpUIGradient)" opacity="0.5"/>
  <rect x="130" y="40" width="30" height="30" rx="4" fill="url(#mcpUIGradient)" opacity="0.5"/>
  <rect x="40" y="130" width="30" height="30" rx="4" fill="url(#mcpUIGradient)" opacity="0.5"/>
  <rect x="130" y="130" width="30" height="30" rx="4" fill="url(#mcpUIGradient)" opacity="0.5"/>
  <!-- Central hub -->
  <circle cx="100" cy="100" r="25" fill="url(#mcpUIGradient)" opacity="0.6"/>
  <!-- Connection lines -->
  <line x1="70" y1="55" x2="100" y2="85" stroke="url(#mcpUIGradient)" stroke-width="2" opacity="0.4"/>
  <line x1="130" y1="55" x2="115" y2="85" stroke="url(#mcpUIGradient)" stroke-width="2" opacity="0.4"/>
  <line x1="70" y1="145" x2="100" y2="115" stroke="url(#mcpUIGradient)" stroke-width="2" opacity="0.4"/>
  <line x1="130" y1="145" x2="115" y2="115" stroke="url(#mcpUIGradient)" stroke-width="2" opacity="0.4"/>
  <!-- Protocol indicators -->
  <circle cx="100" cy="100" r="6" fill="white" opacity="0.8"/>
</svg>

