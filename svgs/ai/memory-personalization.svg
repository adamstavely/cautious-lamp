<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="memoryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Memory storage representation - layered memory blocks -->
  <rect x="50" y="50" width="100" height="20" rx="3" fill="url(#memoryGradient)" opacity="0.5"/>
  <rect x="50" y="80" width="100" height="20" rx="3" fill="url(#memoryGradient)" opacity="0.6"/>
  <rect x="50" y="110" width="100" height="20" rx="3" fill="url(#memoryGradient)" opacity="0.7"/>
  <rect x="50" y="140" width="100" height="20" rx="3" fill="url(#memoryGradient)" opacity="0.8"/>
  <!-- Personalization indicators -->
  <circle cx="70" cy="60" r="4" fill="white" opacity="0.8"/>
  <circle cx="100" cy="90" r="4" fill="white" opacity="0.8"/>
  <circle cx="130" cy="120" r="4" fill="white" opacity="0.8"/>
  <circle cx="90" cy="150" r="4" fill="white" opacity="0.8"/>
  <!-- Connection lines showing memory relationships -->
  <line x1="70" y1="60" x2="100" y2="90" stroke="url(#memoryGradient)" stroke-width="1.5" opacity="0.3"/>
  <line x1="100" y1="90" x2="130" y2="120" stroke="url(#memoryGradient)" stroke-width="1.5" opacity="0.3"/>
  <line x1="130" y1="120" x2="90" y2="150" stroke="url(#memoryGradient)" stroke-width="1.5" opacity="0.3"/>
</svg>

