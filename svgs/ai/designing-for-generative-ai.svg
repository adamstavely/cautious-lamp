<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="generativeAIGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Generative pattern - flowing waves representing AI generation -->
  <path d="M 20 100 Q 50 60, 80 100 T 140 100" stroke="url(#generativeAIGradient)" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 20 120 Q 50 80, 80 120 T 140 120" stroke="url(#generativeAIGradient)" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 20 80 Q 50 40, 80 80 T 140 80" stroke="url(#generativeAIGradient)" stroke-width="3" fill="none" opacity="0.5"/>
  <!-- Central generation nodes -->
  <circle cx="50" cy="100" r="8" fill="url(#generativeAIGradient)" opacity="0.7"/>
  <circle cx="100" cy="100" r="12" fill="url(#generativeAIGradient)" opacity="0.8"/>
  <circle cx="150" cy="100" r="8" fill="url(#generativeAIGradient)" opacity="0.7"/>
  <!-- Sparkle effects representing creativity -->
  <circle cx="70" cy="60" r="4" fill="url(#generativeAIGradient)" opacity="0.6"/>
  <circle cx="130" cy="60" r="4" fill="url(#generativeAIGradient)" opacity="0.6"/>
  <circle cx="70" cy="140" r="4" fill="url(#generativeAIGradient)" opacity="0.6"/>
  <circle cx="130" cy="140" r="4" fill="url(#generativeAIGradient)" opacity="0.6"/>
</svg>

