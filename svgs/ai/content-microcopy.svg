<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="contentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Text/content representation - text lines -->
  <line x1="40" y1="60" x2="160" y2="60" stroke="url(#contentGradient)" stroke-width="4" opacity="0.7"/>
  <line x1="40" y1="85" x2="140" y2="85" stroke="url(#contentGradient)" stroke-width="3" opacity="0.6"/>
  <line x1="40" y1="110" x2="150" y2="110" stroke="url(#contentGradient)" stroke-width="3" opacity="0.6"/>
  <line x1="40" y1="135" x2="130" y2="135" stroke="url(#contentGradient)" stroke-width="2" opacity="0.5"/>
  <!-- Speech bubble for microcopy -->
  <path d="M 60 40 Q 50 30, 40 40 L 30 50 L 40 45 Q 50 35, 60 45 Z" fill="url(#contentGradient)" opacity="0.5"/>
  <circle cx="50" cy="40" r="3" fill="white" opacity="0.8"/>
  <!-- Content emphasis markers -->
  <circle cx="45" cy="60" r="3" fill="url(#contentGradient)" opacity="0.6"/>
  <circle cx="45" cy="110" r="3" fill="url(#contentGradient)" opacity="0.6"/>
</svg>

