<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="metadataGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Document/page representation -->
  <rect x="60" y="50" width="80" height="100" rx="3" fill="url(#metadataGradient)" opacity="0.3" stroke="url(#metadataGradient)" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Metadata tags/labels -->
  <rect x="70" y="60" width="60" height="8" rx="2" fill="url(#metadataGradient)" opacity="0.6"/>
  <rect x="70" y="75" width="50" height="8" rx="2" fill="url(#metadataGradient)" opacity="0.5"/>
  <rect x="70" y="90" width="55" height="8" rx="2" fill="url(#metadataGradient)" opacity="0.5"/>
  <!-- SEO indicators - search/magnifying glass -->
  <circle cx="150" cy="80" r="15" fill="none" stroke="url(#metadataGradient)" stroke-width="3" opacity="0.6"/>
  <line x1="160" y1="90" x2="170" y2="100" stroke="url(#metadataGradient)" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  <!-- Metadata connection lines -->
  <line x1="130" y1="65" x2="135" y2="80" stroke="url(#metadataGradient)" stroke-width="2" opacity="0.3"/>
  <line x1="130" y1="80" x2="135" y2="80" stroke="url(#metadataGradient)" stroke-width="2" opacity="0.3"/>
  <!-- SEO ranking indicators -->
  <rect x="70" y="110" width="10" height="30" rx="2" fill="url(#metadataGradient)" opacity="0.6"/>
  <rect x="85" y="120" width="10" height="20" rx="2" fill="url(#metadataGradient)" opacity="0.5"/>
  <rect x="100" y="125" width="10" height="15" rx="2" fill="url(#metadataGradient)" opacity="0.4"/>
</svg>

