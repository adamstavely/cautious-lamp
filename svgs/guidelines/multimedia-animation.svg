<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="multimediaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Video/media frame -->
  <rect x="50" y="60" width="100" height="70" rx="4" fill="url(#multimediaGradient)" opacity="0.3" stroke="url(#multimediaGradient)" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Play button -->
  <circle cx="100" cy="95" r="15" fill="url(#multimediaGradient)" opacity="0.6"/>
  <path d="M 92 88 L 92 102 L 108 95 Z" fill="white" opacity="0.8"/>
  <!-- Animation frames - sequential positions -->
  <circle cx="70" cy="150" r="8" fill="url(#multimediaGradient)" opacity="0.5"/>
  <circle cx="100" cy="150" r="8" fill="url(#multimediaGradient)" opacity="0.6"/>
  <circle cx="130" cy="150" r="8" fill="url(#multimediaGradient)" opacity="0.5"/>
  <!-- Animation path -->
  <path d="M 70 150 Q 100 140, 130 150" stroke="url(#multimediaGradient)" stroke-width="2" fill="none" opacity="0.4"/>
  <!-- Media type indicators -->
  <rect x="55" y="65" width="8" height="8" rx="1" fill="url(#multimediaGradient)" opacity="0.5"/>
  <rect x="137" y="65" width="8" height="8" rx="1" fill="url(#multimediaGradient)" opacity="0.5"/>
</svg>

