<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="iaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Hierarchical structure - tree representation -->
  <!-- Top level -->
  <circle cx="100" cy="50" r="12" fill="url(#iaGradient)" opacity="0.7"/>
  <!-- Second level -->
  <circle cx="60" cy="100" r="10" fill="url(#iaGradient)" opacity="0.6"/>
  <circle cx="100" cy="100" r="10" fill="url(#iaGradient)" opacity="0.6"/>
  <circle cx="140" cy="100" r="10" fill="url(#iaGradient)" opacity="0.6"/>
  <!-- Third level -->
  <circle cx="50" cy="140" r="8" fill="url(#iaGradient)" opacity="0.5"/>
  <circle cx="70" cy="140" r="8" fill="url(#iaGradient)" opacity="0.5"/>
  <circle cx="90" cy="140" r="8" fill="url(#iaGradient)" opacity="0.5"/>
  <circle cx="110" cy="140" r="8" fill="url(#iaGradient)" opacity="0.5"/>
  <circle cx="130" cy="140" r="8" fill="url(#iaGradient)" opacity="0.5"/>
  <circle cx="150" cy="140" r="8" fill="url(#iaGradient)" opacity="0.5"/>
  <!-- Connection lines -->
  <line x1="100" y1="62" x2="60" y2="90" stroke="url(#iaGradient)" stroke-width="2" opacity="0.4"/>
  <line x1="100" y1="62" x2="100" y2="90" stroke="url(#iaGradient)" stroke-width="2" opacity="0.4"/>
  <line x1="100" y1="62" x2="140" y2="90" stroke="url(#iaGradient)" stroke-width="2" opacity="0.4"/>
  <line x1="60" y1="110" x2="50" y2="132" stroke="url(#iaGradient)" stroke-width="1.5" opacity="0.3"/>
  <line x1="60" y1="110" x2="70" y2="132" stroke="url(#iaGradient)" stroke-width="1.5" opacity="0.3"/>
  <line x1="100" y1="110" x2="90" y2="132" stroke="url(#iaGradient)" stroke-width="1.5" opacity="0.3"/>
  <line x1="100" y1="110" x2="110" y2="132" stroke="url(#iaGradient)" stroke-width="1.5" opacity="0.3"/>
  <line x1="140" y1="110" x2="130" y2="132" stroke="url(#iaGradient)" stroke-width="1.5" opacity="0.3"/>
  <line x1="140" y1="110" x2="150" y2="132" stroke="url(#iaGradient)" stroke-width="1.5" opacity="0.3"/>
</svg>

