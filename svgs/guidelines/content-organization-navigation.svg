<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="contentNavGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Navigation structure - hierarchical organization -->
  <rect x="40" y="40" width="120" height="20" rx="3" fill="url(#contentNavGradient)" opacity="0.6"/>
  <!-- Secondary navigation items -->
  <rect x="50" y="70" width="45" height="15" rx="2" fill="url(#contentNavGradient)" opacity="0.5"/>
  <rect x="105" y="70" width="45" height="15" rx="2" fill="url(#contentNavGradient)" opacity="0.5"/>
  <!-- Content blocks -->
  <rect x="50" y="100" width="100" height="20" rx="2" fill="url(#contentNavGradient)" opacity="0.4"/>
  <rect x="50" y="130" width="100" height="20" rx="2" fill="url(#contentNavGradient)" opacity="0.4"/>
  <!-- Navigation connections -->
  <line x1="50" y1="60" x2="50" y2="70" stroke="url(#contentNavGradient)" stroke-width="2" opacity="0.3"/>
  <line x1="105" y1="60" x2="105" y2="70" stroke="url(#contentNavGradient)" stroke-width="2" opacity="0.3"/>
  <line x1="100" y1="85" x2="100" y2="100" stroke="url(#contentNavGradient)" stroke-width="2" opacity="0.3"/>
  <!-- Navigation indicators -->
  <circle cx="45" cy="50" r="3" fill="url(#contentNavGradient)" opacity="0.6"/>
  <circle cx="155" cy="50" r="3" fill="url(#contentNavGradient)" opacity="0.6"/>
</svg>

