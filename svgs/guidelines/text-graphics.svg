<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="textGraphicsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Text lines -->
  <line x1="50" y1="70" x2="150" y2="70" stroke="url(#textGraphicsGradient)" stroke-width="4" opacity="0.7"/>
  <line x1="50" y1="95" x2="140" y2="95" stroke="url(#textGraphicsGradient)" stroke-width="3" opacity="0.6"/>
  <line x1="50" y1="120" x2="145" y2="120" stroke="url(#textGraphicsGradient)" stroke-width="3" opacity="0.6"/>
  <!-- Graphic elements -->
  <circle cx="70" cy="150" r="15" fill="url(#textGraphicsGradient)" opacity="0.5"/>
  <rect x="110" y="135" width="30" height="30" rx="3" fill="url(#textGraphicsGradient)" opacity="0.5"/>
  <!-- Text and graphic integration -->
  <line x1="50" y1="125" x2="70" y2="135" stroke="url(#textGraphicsGradient)" stroke-width="2" opacity="0.3"/>
  <line x1="140" y1="125" x2="125" y2="135" stroke="url(#textGraphicsGradient)" stroke-width="2" opacity="0.3"/>
  <!-- Text emphasis -->
  <circle cx="55" cy="70" r="3" fill="url(#textGraphicsGradient)" opacity="0.6"/>
  <circle cx="55" cy="120" r="3" fill="url(#textGraphicsGradient)" opacity="0.6"/>
</svg>

