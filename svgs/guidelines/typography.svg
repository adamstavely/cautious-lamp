<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="typographyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Typography lines - different weights -->
  <line x1="40" y1="60" x2="160" y2="60" stroke="url(#typographyGradient)" stroke-width="5" opacity="0.8"/>
  <line x1="40" y1="90" x2="160" y2="90" stroke="url(#typographyGradient)" stroke-width="4" opacity="0.7"/>
  <line x1="40" y1="120" x2="160" y2="120" stroke="url(#typographyGradient)" stroke-width="3" opacity="0.6"/>
  <line x1="40" y1="150" x2="160" y2="150" stroke="url(#typographyGradient)" stroke-width="2" opacity="0.5"/>
  <!-- Letter "A" representation -->
  <path d="M 100 50 L 70 150 L 85 150 L 95 120 L 105 120 L 115 150 L 130 150 L 100 50 Z" fill="url(#typographyGradient)" opacity="0.3"/>
  <!-- Typography baseline -->
  <line x1="40" y1="150" x2="160" y2="150" stroke="url(#typographyGradient)" stroke-width="1" opacity="0.2" stroke-dasharray="2,2"/>
</svg>

