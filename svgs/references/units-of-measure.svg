<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="unitsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Ruler/measurement tool -->
  <rect x="50" y="80" width="100" height="20" rx="2" fill="url(#unitsGradient)" opacity="0.4" stroke="url(#unitsGradient)" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Measurement marks -->
  <line x1="60" y1="80" x2="60" y2="75" stroke="url(#unitsGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="80" y1="80" x2="80" y2="75" stroke="url(#unitsGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="80" x2="100" y2="75" stroke="url(#unitsGradient)" stroke-width="3" opacity="0.7"/>
  <line x1="120" y1="80" x2="120" y2="75" stroke="url(#unitsGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="140" y1="80" x2="140" y2="75" stroke="url(#unitsGradient)" stroke-width="2" opacity="0.6"/>
  <!-- Measurement indicators -->
  <line x1="50" y1="100" x2="60" y2="100" stroke="url(#unitsGradient)" stroke-width="2" opacity="0.5"/>
  <line x1="60" y1="100" x2="100" y2="100" stroke="url(#unitsGradient)" stroke-width="2" opacity="0.5"/>
  <line x1="100" y1="100" x2="150" y2="100" stroke="url(#unitsGradient)" stroke-width="2" opacity="0.5"/>
  <!-- Unit labels representation -->
  <circle cx="55" cy="110" r="6" fill="url(#unitsGradient)" opacity="0.5"/>
  <circle cx="100" cy="110" r="6" fill="url(#unitsGradient)" opacity="0.6"/>
  <circle cx="145" cy="110" r="6" fill="url(#unitsGradient)" opacity="0.5"/>
  <!-- Different unit types -->
  <rect x="60" y="130" width="25" height="15" rx="2" fill="url(#unitsGradient)" opacity="0.4"/>
  <circle cx="115" cy="137" r="8" fill="url(#unitsGradient)" opacity="0.4"/>
  <path d="M 135 130 L 150 130 L 142 145 Z" fill="url(#unitsGradient)" opacity="0.4"/>
  <!-- Scale indicator -->
  <line x1="50" y1="60" x2="150" y2="60" stroke="url(#unitsGradient)" stroke-width="1" opacity="0.3" stroke-dasharray="2,2"/>
  <line x1="50" y1="155" x2="150" y2="155" stroke="url(#unitsGradient)" stroke-width="1" opacity="0.3" stroke-dasharray="2,2"/>
</svg>

