<svg viewBox="0 0 200 200" class="w-full h-full text-indigo-400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="jawsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Keyboard representation -->
  <rect x="50" y="60" width="100" height="70" rx="4" fill="url(#jawsGradient)" opacity="0.3" stroke="url(#jawsGradient)" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Keyboard keys with modifier indicators -->
  <rect x="60" y="70" width="18" height="18" rx="2" fill="url(#jawsGradient)" opacity="0.6"/>
  <rect x="82" y="70" width="18" height="18" rx="2" fill="url(#jawsGradient)" opacity="0.5"/>
  <rect x="104" y="70" width="18" height="18" rx="2" fill="url(#jawsGradient)" opacity="0.6"/>
  <rect x="126" y="70" width="18" height="18" rx="2" fill="url(#jawsGradient)" opacity="0.5"/>
  <!-- Modifier key (Ctrl/Alt) -->
  <rect x="60" y="95" width="30" height="18" rx="2" fill="url(#jawsGradient)" opacity="0.7"/>
  <rect x="95" y="95" width="30" height="18" rx="2" fill="url(#jawsGradient)" opacity="0.7"/>
  <!-- Command flow indicator -->
  <path d="M 50 50 Q 100 40, 150 50" stroke="url(#jawsGradient)" stroke-width="3" fill="none" opacity="0.5"/>
  <circle cx="50" cy="50" r="5" fill="url(#jawsGradient)" opacity="0.7"/>
  <circle cx="100" cy="40" r="5" fill="url(#jawsGradient)" opacity="0.7"/>
  <circle cx="150" cy="50" r="5" fill="url(#jawsGradient)" opacity="0.7"/>
  <!-- Screen reader indicator -->
  <circle cx="100" cy="150" r="20" fill="url(#jawsGradient)" opacity="0.3" stroke="url(#jawsGradient)" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="100" cy="150" r="10" fill="url(#jawsGradient)" opacity="0.5"/>
  <!-- Audio/speech waves -->
  <path d="M 70 150 Q 75 140, 80 150 T 90 150" stroke="url(#jawsGradient)" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 110 150 Q 115 140, 120 150 T 130 150" stroke="url(#jawsGradient)" stroke-width="2" fill="none" opacity="0.4"/>
</svg>

