services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: color-palette-elasticsearch
    environment:
      - discovery.type=single-node
      # Security is off for local development only. The port is bound to
      # 127.0.0.1 so the unauthenticated node isn't reachable from the network.
      # Enable xpack security and set ELASTICSEARCH_USERNAME/PASSWORD for any
      # shared or deployed environment.
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  # The backend with IRIS and Chromium built in (backend/Dockerfile). Optional:
  #   docker compose --profile backend up --build
  # It reads backend/.env if there is one; Elasticsearch is the service above.
  # Argos and OpenReplay aren't here: neither can run as a local container
  # (docs/INTEGRATIONS.md).
  backend:
    profiles: ["backend"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: backend/.env
        required: false
    environment:
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      PORT: "3000"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - backend_uploads:/app/backend/uploads
    depends_on:
      - elasticsearch

volumes:
  elasticsearch_data:
  backend_uploads:
