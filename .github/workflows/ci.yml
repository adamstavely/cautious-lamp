name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace backend
      - run: npm test --workspace backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:sfc --workspace frontend
      - run: npm run check:styles --workspace frontend
      - run: npm test --workspace frontend
      - run: npm run build --workspace frontend

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The CLI depends on the SDK, so the SDK builds first.
      - run: npm run build --workspace sdk
      - run: npm test --workspace sdk --if-present
      - run: npm run build --workspace cli
      - run: npm test --workspace cli --if-present
      - run: npm run build --workspace mcp-server
      - run: npm test --workspace mcp-server
      - run: npm run build --workspace eslint-plugin-design-system
      - run: npm test --workspace eslint-plugin-design-system
      # Not workspaces: they resolve vite, vue and typescript from the root node_modules
      - run: npm test
        working-directory: loupe-tool-standalone
      - run: npm run build && npm run test:pack
        working-directory: loupe-tool-standalone
      - run: npm run build && npm run test:pack
        working-directory: breakpoint-overlay-standalone
      - run: npm test
        working-directory: vscode-design-system-extension
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The image builds IRIS from source; the layer cache keeps that to the first run
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: cautious-lamp-backend:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # IRIS analyses real videos through the backend's runner, and Chromium starts
      - run: backend/docker/smoke-test.sh cautious-lamp-backend:ci
